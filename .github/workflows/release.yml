name: Publicar release

on:
  workflow_run:
    workflows: ["Build AZASing"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-15
    steps:
      - name: Descargar el IPA compilado
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Poner el número de compilación en el IPA
        run: |
          IPA=$(find artifacts -name "*.ipa" | head -1)
          echo "IPA: $IPA"
          mkdir work && cd work
          unzip -q "../$IPA"
          APP=$(ls -d Payload/*.app | head -1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.event.workflow_run.run_number }}" "$APP/Info.plist"
          zip -qr ../AZASing.ipa Payload

      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=${{ github.event.workflow_run.run_number }}
          gh release create "build-$N" AZASing.ipa \
            --repo "${{ github.repository }}" \
            --title "AZASing build $N" \
            --notes "Nueva versión de AZASing (compilación $N)." \
            --latest
